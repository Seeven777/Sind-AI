<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · Mission Control</title><link rel="stylesheet" href="/app-shell.css"></head><body>
<header><div class="brand">JARVIS <small>Mission Control</small></div><nav><a href="/">Companion</a><a href="/hq">HQ</a><a class="active" href="/mission-control">Missões</a><a href="/agents">Agentes</a><a href="/projects">Projetos</a><a href="/memory">Memória</a><a href="/system">Sistema</a></nav><div class="top-meta">LIVE OPERATIONS</div></header>
<main class="page"><div class="page-title"><div><span class="eyebrow">ORCHESTRATION</span><h1>Mission Control</h1><p>Missões, handoffs, approvals, tools e evidências em um único cockpit.</p></div><div class="toolbar"><button id="new-mission" class="primary-action">+ Nova missão</button><button id="refresh" class="secondary-action">Atualizar</button></div></div>
<section class="card span12"><div class="tabs" id="tabs"><button class="active" data-tab="missions">Pipeline</button><button data-tab="attention">Atenção</button><button data-tab="tools">Tools</button><button data-tab="events">Event Bus</button></div>
<div id="panel-missions"><div id="missions"></div></div><div id="panel-attention" class="hidden"><div id="attention"></div></div><div id="panel-tools" class="hidden"><div id="tools"></div></div><div id="panel-events" class="hidden"><div id="events"></div></div></section></main>
<dialog id="mission-dialog" class="modal"><form method="dialog" id="mission-form"><span class="eyebrow">NEW MISSION</span><h2>Delegar missão</h2><label>Objetivo<textarea class="input" id="mission-objective" required placeholder="Descreva o resultado desejado"></textarea></label><label>Título<input class="input" id="mission-title" placeholder="Opcional"></label><div class="actions"><button class="secondary-action" value="cancel">Cancelar</button><button class="primary-action" id="submit-mission" value="default">Iniciar</button></div></form></dialog><script src="/mission-control.js"></script></body></html>
