[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-next"
version = "1.0.0rc5.post2"
description = "Jarvis Next Personal Agent Operating System"
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.0",
  "pypdf>=6.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
desktop = [
  "playwright>=1.50",
  "pywinauto>=0.6.9",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
